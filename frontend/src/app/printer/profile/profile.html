<h1 class="ph-page-title">Profil štamparije</h1>

<div class="ph-card">
  <div class="row">
    <div class="col-md-3 text-center">
      <img [src]="'/uploads/' + (auth.user()?.profileImage || 'default_profile_image.jpg')" class="rounded-circle mb-2" style="width:120px;height:120px;object-fit:cover;" />
      <input type="file" class="form-control form-control-sm" accept="image/jpeg,image/png,image/gif" (change)="onFileSelected($event)" />
    </div>
    <div class="col-md-9">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Korisničko ime</label>
          <input type="text" class="form-control" [value]="auth.user()?.username" disabled />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">E-mejl</label>
          <input type="email" class="form-control" name="email" [(ngModel)]="email" />
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Ime odgovornog lica</label>
          <input type="text" class="form-control" name="firstName" [(ngModel)]="firstName" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Prezime odgovornog lica</label>
          <input type="text" class="form-control" name="lastName" [(ngModel)]="lastName" />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Telefon</label>
        <input type="tel" class="form-control" name="phone" [(ngModel)]="phone" />
      </div>

      <div class="mb-3">
        <label class="form-label">Naziv štamparije</label>
        <input type="text" class="form-control" name="companyName" [(ngModel)]="companyName" />
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Adresa</label>
          <input type="text" class="form-control" name="address" [(ngModel)]="address" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Grad</label>
          <input type="text" class="form-control" name="city" [(ngModel)]="city" />
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Matični broj</label>
          <input type="text" class="form-control" [value]="auth.user()?.registrationNumber" disabled />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">PIB</label>
          <input type="text" class="form-control" [value]="auth.user()?.pib" disabled />
        </div>
      </div>

      <button type="button" class="btn ph-btn-primary" (click)="save()" [disabled]="saving">
        {{ saving ? "Čuvanje..." : "Sačuvaj izmene" }}
      </button>
      @if (saveMessage) {
        <span class="ms-2">{{ saveMessage }}</span>
      }
    </div>
  </div>
</div>
